<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyApp - APK Download</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #d1d5db;
        }

        .card {
            width: 92%;
            max-width: 480px;
            margin: 35px auto;
            background: white;
            border-radius: 20px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.10);
        }

        .app-icon {
            width: 100px;
            height: 100px;
            margin: auto;
            margin-bottom: 18px;
            border-radius: 22px;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .card h2 {
            font-size: 26px;
            margin-bottom: 12px;
        }

        .description {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .info {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 22px;
            line-height: 1.8;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: #16a34a;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 19px;
            font-weight: bold;
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .note {
            margin-top: 18px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>MyApp</h1>
        <p>Official APK Download</p>
    </header>

    <main class="card">

        <div class="app-icon">
            📱
        </div>

        <h2>MyApp</h2>

        <p class="description">
            यह मेरा Android App है।
            नीचे दिए गए button से APK डाउनलोड करें।
        </p>

        <div class="info">
            <b>Version:</b> 1.0<br>
            <b>APK Size:</b> 6 MB<br>
            <b>File:</b> MyApp.apk
        </div>

        <a class="download-btn" href="./MyApp.apk">
            ⬇️ DOWNLOAD APK
        </a>

        <p class="note">
            Download button दबाकर APK file डाउनलोड करें।
            डाउनलोड पूरा होने के बाद अपने फोन के Downloads folder में APK देखें।
        </p>

    </main>

    <footer>
        © 2026 MyApp
    </footer>

</body>
</html>
