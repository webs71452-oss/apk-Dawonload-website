<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video App - Download</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 25px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    .app-icon {
      width: 90px;
      height: 90px;
      margin: 0 auto 18px;
      border-radius: 22px;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
    }

    h1 {
      font-size: 28px;
      color: #111827;
      margin-bottom: 10px;
    }

    .description {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .download-btn,
    .view-btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .download-btn {
      background: #16a34a;
      color: white;
    }

    .download-btn:hover {
      background: #15803d;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 14px;
      background: #dcfce7;
      color: #166534;
      font-weight: bold;
      line-height: 1.5;
    }

    .view-btn {
      margin-top: 12px;
      background: #2563eb;
      color: white;
    }

    .view-btn:hover {
      background: #1d4ed8;
    }

    .small {
      margin-top: 20px;
      color: #9ca3af;
      font-size: 12px;
      line-height: 1.5;
    }

    #downloadFrame {
      display: none;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="app-icon">
      ▶️
    </div>

    <h1>Video App</h1>

    <div class="description">
      Download the Android application and enjoy the app.
    </div>

    <!-- DOWNLOAD BUTTON -->
    <a
      id="downloadButton"
      class="download-btn"
      href="video.apk"
      download="video.apk"
      target="_blank">
      ⬇️ DOWNLOAD APK
    </a>

    <!-- STATUS -->
    <div id="statusBox" class="status">
      ✅ Download Started Successfully!
      <br>
      Your APK download has started.
    </div>

    <!-- VIEW BUTTON -->
    <a
      id="viewButton"
      class="view-btn"
      href="video.apk"
      target="_blank"
      style="display:none;">
      📱 VIEW APK
    </a>

    <div class="small">
      Android APK • Free Download
    </div>

  </div>

  <script>
    const downloadButton = document.getElementById("downloadButton");
    const statusBox = document.getElementById("statusBox");
    const viewButton = document.getElementById("viewButton");

    downloadButton.addEventListener("click", function () {

      statusBox.style.display = "block";
      viewButton.style.display = "block";

      downloadButton.innerHTML = "✅ DOWNLOAD STARTED";

      setTimeout(function () {
        downloadButton.innerHTML = "⬇️ DOWNLOAD APK";
      }, 3000);

    });
  </script>

</body>
</html>
